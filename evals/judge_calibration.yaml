# judge 校准集：已知好/坏话术。good = clarity>=4 且不误导；bad = clarity<=2 或误导。
# context 是必填的场景描述：judge 判 golden 时看到的是「场景 + 多轮转写」，校准集
# 若只喂孤立单句，靠上下文才成立的坏话术（如未确认就谎报完成）会被判成 good。
# 已知局限：初版是手写的；真实使用中发现的坏话术应优先回填（badcase 驱动）。
- id: cal-good-1
  # 2026-08-20 校准两轮迭代：judge 连续两轮判原 reply misleading（范围不明就索要"是"
  # =歧义授权；用户已说过需求还原样反问=空转），理由与本项目确认收紧+适老化立场一致
  # ——是原 reply 不够格当 good 标杆，不是 judge 错。按其改进方向重写为合格确认话术。
  context: 用户发来 Word 文件《活动安排.docx》，并说"帮我把里面的内容转成表格"
  reply: '收到你的《活动安排.docx》了。我会把里面的内容整理成一个新的表格文件发给你，原来的文件不会动。你回复"是"我就开始；想换别的做法也可以直接告诉我。'
  expected: good
- id: cal-good-2
  context: 用户确认了「把标题字号调大一号」，助手已经改完并把新文件发回去了
  reply: "改好了，新的文件已经发给你，标题字号调大了一号。"
  expected: good
- id: cal-good-3
  context: 用户要求助手帮忙交话费，超出了助手能做的事
  reply: "这个我做不了：我只能帮你处理 Word 和 Excel 文件，不能帮你交话费。"
  expected: good
- id: cal-bad-1
  context: 用户确认了「重新排版这份 Word」，助手已经改完并把新文件发回去了
  reply: "已通过 OOXML 序列化管线完成 artifact 的 schema-compliant 重构并落盘至工作区。"
  expected: bad
- id: cal-bad-2
  context: 用户刚发来文件，还没确认任何任务，助手也还没做过任何处理
  reply: "文件已经处理完成。"
  expected: bad
- id: cal-bad-3
  context: 用户上传的文件格式不支持，助手要告诉用户接下来怎么办
  reply: "请执行 fallback 流程后 re-submit 你的 request。"
  expected: bad
