[project]
name = "walkie-dokie"
version = "0.1.0"
description = "Multi-platform bot office assistant for elderly users, backed by pluggable coding agents"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2.12,<5.3",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx",
    "jieba==0.42.1",
    "openai",
    "pypdf>=6.14.2,<7",
    "python-dotenv",
    "RapidFuzz>=3.14,<4",
    "lark-oapi",
    "python-docx",
    "rank-bm25==0.2.2",
    "openpyxl",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
# 执行后端二选一或都装；Codex 走 CLI/子进程调用，暂无需专门的 pip 依赖。
claude = ["claude-agent-sdk"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest", "pytest-asyncio", "pytest-django"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
