[project]
name = "walkie-dokie"
version = "0.1.0"
description = "Multi-platform bot office assistant for elderly users, backed by pluggable coding agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx",
    "openai",
    "python-dotenv",
    "lark-oapi",
    "python-docx",
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
# 执行后端二选一或都装；Codex 走 CLI/子进程调用，暂无需专门的 pip 依赖。
claude = ["claude-agent-sdk"]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
